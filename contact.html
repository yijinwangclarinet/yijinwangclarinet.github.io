  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Italiana&family=Manrope:wght@300;400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css?v=20260807-30">

<body class="contact-page">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header dark-header"><a class="monogram" href="index.html" aria-label="Yijin Wang, home">YW</a><button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav"><span>Menu</span><i aria-hidden="true"></i></button><nav class="site-nav" id="site-nav" aria-label="Main navigation"><a href="index.html">Home</a><a href="bio.html">Bio</a><a href="gallery.html">Gallery</a><a href="video.html">Video</a><a class="lessons-nav" href="lessons.html">Lessons</a><a class="active" href="contact.html">Contact</a></nav></header>
  <main id="main" class="contact-main">
    <section class="contact-copy reveal">
      <h1>CONTACT</h1>
      <p class="contact-intro">For lessons, masterclasses, performances, and collaborations.</p>
      <div class="contact-meta">
        <p><span>Email</span><a href="mailto:yijinwangclarinet@gmail.com">yijinwangclarinet@gmail.com</a></p>
        <p><span>Location</span>Orlando Area, Florida</p>
      </div>
    </section>
    <!-- Add a form-service action and method here when the site is ready to send messages. -->
    <form class="contact-form reveal" id="contact-form">
      <label>Name<input type="text" name="name" autocomplete="name" required placeholder="Your name"></label>
      <label>Email<input type="email" name="email" autocomplete="email" required placeholder="you@example.com"></label>
      <label>Subject<input type="text" name="subject" required placeholder="Subject"></label>
      <label>Message<textarea name="message" rows="5" required placeholder="Tell me a little about your inquiry"></textarea></label>
      <button type="submit">Send message <span aria-hidden="true">↗</span></button><p class="form-status" role="status"></p>
    </form>
  </main>
  <script src="script.js"></script>
</body>
</html>
